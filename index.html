<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Kite login</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --accent: #2481cc; --line: #e2e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e8eaee; --muted: #a2a9b6; --accent: #4ba3e8; --line: #2c313a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
         border-radius: 14px; padding: 24px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 10px; border: 0; margin-top: 10px;
         font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Kite login</h1>
  <p id="text">Reading the login…</p>
  <a id="open" class="btn primary" hidden>Open Telegram</a>
  <button id="copy" class="btn secondary" type="button" hidden>Copy login code</button>
</main>
<script>
// kite-callback: Kite redirects here after you log in. This page hands the one-time
// request_token to your own Telegram bot (as "/start k<request_token>_<state>") and does
// nothing else: no network calls, no storage, no third-party code. The token works once,
// expires in minutes and is useless without the Kite API secret, which only your server has.
(function () {
  "use strict";
  var q = new URLSearchParams(window.location.search);
  // Read the values, then take them out of the address bar and the browser history.
  window.history.replaceState(null, "", window.location.pathname);

  var status = q.get("status") || "";
  var rt = q.get("request_token") || "";
  var state = q.get("state") || "";
  var bot = q.get("bot") || "";
  var title = document.getElementById("title");
  var text = document.getElementById("text");

  if (status !== "success") {
    title.textContent = "Kite login did not succeed";
    text.textContent = "Go back to Telegram and send /login to your bot for a new link.";
    return;
  }
  if (!/^[A-Za-z0-9]{8,40}$/.test(rt) || !/^[A-Za-z0-9_-]{8,20}$/.test(state) || !/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(bot)) {
    title.textContent = "No login to pass on";
    text.textContent = "Open this page only from the login link your bot sends (send /login).";
    return;
  }

  var payload = "k" + rt + "_" + state;          // Telegram allows up to 64 characters: A-Z a-z 0-9 _ -
  var app = "tg://resolve?domain=" + bot + "&start=" + payload;
  var web = "https://t.me/" + bot + "?start=" + payload;

  title.textContent = "Logged in to Kite";
  text.textContent = "Opening Telegram: tap Start there to finish. If nothing happens, use the button.";
  var open = document.getElementById("open");
  open.href = web;
  open.hidden = false;
  var copy = document.getElementById("copy");
  copy.hidden = false;
  copy.addEventListener("click", function () {
    var code = "/start " + payload;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(function () {
        copy.textContent = "Copied: paste it to your bot";
      });
    }
  });
  window.location.replace(app);
})();
</script>
</body>
</html>
